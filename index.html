<script type="text/babel" data-presets="react">
/* =====================================================================
   STOKSYNC — Satu Stok Untuk Semua Toko
   ---------------------------------------------------------------------
   Arsitektur single-file:
   - React 18 (UMD) + Tailwind Play CDN + Lucide icons
   - Store: mini-store ala Zustand (useSyncExternalStore), 1 sumber state
   - Database: localStorage key "stoksync_v1" — skema siap migrasi Supabase:
       products, marketplaces, orders, sync_logs, settings, users
   - Logic inti: handleOrder() — sinkronisasi stok atomik anti race-condition
   ===================================================================== */
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const useSyncExternalStore = React.useSyncExternalStore;

/* ============================== UTIL ============================== */
const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const delay = (ms) => new Promise((r) => setTimeout(r, ms));
const fmtIDR = (n) => 'Rp' + Number(n || 0).toLocaleString('id-ID');
const fmtNum = (n) => Number(n || 0).toLocaleString('id-ID');
const fmtDate = (ts) => new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtTime = (ts) => new Date(ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

/* Waktu relatif ala "2 detik lalu" untuk log realtime */
function timeAgo(ts, now) {
  const s = Math.max(0, Math.floor(((now || Date.now()) - ts) / 1000));
  if (s < 5) return 'baru saja';
  if (s < 60) return s + ' detik lalu';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' menit lalu';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' jam lalu';
  const d = Math.floor(h / 24);
  if (d < 7) return d + ' hari lalu';
  return fmtDate(ts);
}
const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };

/* Unduh CSV dari array of objects */
function downloadCSV(filename, rows) {
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const esc = (v) => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [headers.join(','), ...rows.map((r) => headers.map((h) => esc(r[h])).join(','))].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* Parser CSV sederhana (mendukung quoted field) */
function parseCSV(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter((l) => l.trim() !== '');
  if (lines.length < 2) return [];
  const splitRow = (row) => {
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (q) {
        if (c === '"') { if (row[i+1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { out.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    out.push(cur.trim());
    return out;
  };
  const headers = splitRow(lines[0]).map((h) => h.toLowerCase());
  return lines.slice(1).map((ln) => {
    const cells = splitRow(ln);
    const o = {};
    headers.forEach((h, i) => { o[h] = cells[i] || ''; });
    return o;
  });
}

/* ===================== KONSTANTA MARKETPLACE ===================== */
const MP = [
  { id: 'shopee',    name: 'Shopee',      color: '#EE4D2D', soft: '#FFF0EA', letter: 'S' },
  { id: 'tokopedia', name: 'Tokopedia',   color: '#03AC0E', soft: '#EAF9EC', letter: 'T' },
  { id: 'tiktok',    name: 'TikTok Shop', color: '#111111', soft: '#F1F1F6', letter: 'Tk' },
  { id: 'lazada',    name: 'Lazada',      color: '#0F146D', soft: '#ECECFB', letter: 'L' },
];
const mpById = (id) => MP.find((m) => m.id === id) || MP[0];

const BUYERS = ['Andini Pratiwi','Budi Santoso','Siti Rahayu','Agus Wijaya','Dewi Lestari','Rina Marlina','Joko Prasetyo','Maya Anggraini','Fajar Nugroho','Intan Permata','Hendra Gunawan','Lilis Suryani','Putri Ayu','Dimas Ramadhan','Nita Kurnia'];
const randomBuyer = () => BUYERS[Math.floor(Math.random() * BUYERS.length)];

/* ===================== MINI-STORE (ala Zustand) =====================
   Satu sumber kebenaran. Semua update lewat setState dengan updater
   function agar atomik — tidak ada race condition antar komponen.   */
function createStore(initial) {
  let state = initial;
  const listeners = new Set();
  const getState = () => state;
  const setState = (partial) => {
    const next = typeof partial === 'function' ? partial(state) : partial;
    if (next === state) return;
    state = Object.assign({}, state, next);
    listeners.forEach((l) => l());
    persistSoon();
  };
  const subscribe = (l) => { listeners.add(l); return () => listeners.delete(l); };
  return { getState, setState, subscribe };
}
function useStore(sel) {
  /* ala Zustand: snapshot = hasil selector, React bail-out bila identik */
  return useSyncExternalStore(store.subscribe, () => (sel ? sel(store.getState()) : store.getState()));
}

/* ===================== PERSISTENCE (localStorage) =====================
   Skema siap-Supabase: products | marketplaces | orders | sync_logs |
   settings | users. Untuk migrasi, ganti loadPersisted/persistSoon
   dengan Supabase client (lihat PANDUAN.md).                              */
const LS_KEY = 'stoksync_v1';
let persistTimer = null;
function persistSoon() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    try {
      const s = store.getState();
      localStorage.setItem(LS_KEY, JSON.stringify({
        products: s.products, marketplaces: s.marketplaces, orders: s.orders,
        syncLogs: s.syncLogs, settings: s.settings, users: s.users, user: s.user,
      }));
    } catch (e) { /* storage penuh / mode privat: abaikan */ }
  }, 250);
}
function loadPersisted() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}

/* ===================== SEED: 10 PRODUK UMKM ASLI =====================
   [nama, sku, kategori, ikon lucide, gradien, stokMaster, hrgShopee, hrgTokopedia, hrgTiktok, hrgLazada] */
const SEED_PRODUCTS = [
  ['Kaos Polos Hitam Cotton Combed 30s', 'KOS-HTM-001', 'Fashion', 'shirt', 'from-slate-700 to-slate-900', 48, 45000, 47000, 43000, 46000],
  ['Keripik Singkong Balado 250g', 'KRP-BLD-002', 'Makanan', 'cookie', 'from-amber-400 to-orange-600', 120, 18000, 19000, 17500, 18500],
  ['Hijab Segiempat Voal Premium', 'HJB-VOL-003', 'Fashion', 'layers', 'from-rose-400 to-pink-600', 36, 55000, 57000, 52000, 56000],
  ['Batik Tulis Klaten Motif Parang', 'BTK-PRG-004', 'Fashion', 'sparkles', 'from-indigo-500 to-purple-700', 15, 285000, 295000, 279000, 289000],
  ['Madu Murni Hutan Sumbawa 500ml', 'MAD-HUT-005', 'Kesehatan', 'droplets', 'from-yellow-400 to-amber-600', 32, 95000, 98000, 92000, 96000],
  ['Kopi Robusta Temanggung 200g', 'KOP-RBS-006', 'Minuman', 'coffee', 'from-stone-500 to-amber-800', 64, 38000, 39000, 36500, 38500],
  ['Tas Anyaman Pandan Premium', 'TAS-PND-007', 'Kerajinan', 'shopping-bag', 'from-emerald-400 to-teal-600', 22, 75000, 78000, 72000, 76000],
  ['Sambal Pecel Khas Madiun 200g', 'SBL-PCL-008', 'Makanan', 'flame', 'from-red-500 to-orange-600', 85, 25000, 26000, 24000, 25500],
  ['Sepatu Sneakers Kanvas Putih', 'SPT-SNK-009', 'Fashion', 'footprints', 'from-sky-400 to-blue-600', 27, 129000, 135000, 125000, 132000],
  ['Lilin Aromaterapi Lavender', 'LLN-LVN-010', 'Home & Living', 'sparkles', 'from-violet-400 to-purple-600', 40, 35000, 36000, 33500, 35500],
];

function buildSeed() {
  const now = Date.now();
  const products = SEED_PRODUCTS.map((p) => ({
    id: uid('prd'), name: p[0], sku: p[1], category: p[2], icon: p[3], grad: p[4],
    masterStock: p[5],
    stocks: { shopee: p[5], tokopedia: p[5], tiktok: p[5], lazada: p[5] },
    prices: { shopee: p[6], tokopedia: p[7], tiktok: p[8], lazada: p[9] },
    createdAt: now,
  }));
  const marketplaces = [
    { id: 'shopee', connected: true, apiKey: 'shp_•••• •••• 3f9a', lastSync: now - 4 * 60000 },
    { id: 'tokopedia', connected: true, apiKey: 'tkp_•••• •••• 77c1', lastSync: now - 11 * 60000 },
    { id: 'tiktok', connected: false, apiKey: '', lastSync: null },
    { id: 'lazada', connected: false, apiKey: '', lastSync: null },
  ];

  /* Riwayat pesanan 7 hari ke belakang agar grafik langsung hidup */
  const orders = [];
  for (let d = 6; d >= 0; d--) {
    const count = 2 + Math.floor(Math.random() * 4);
    for (let i = 0; i < count; i++) {
      const p = products[Math.floor(Math.random() * products.length)];
      const mp = MP[Math.floor(Math.random() * MP.length)].id;
      const qty = 1 + Math.floor(Math.random() * 2);
      const ts = now - d * 86400000 - Math.floor(Math.random() * 14) * 3600000 - Math.floor(Math.random() * 60) * 60000;
      orders.push({
        id: uid('ord'),
        code: 'INV/' + new Date(ts).toISOString().slice(0, 10).replace(/-/g, '') + '/' + (1000 + Math.floor(Math.random() * 9000)),
        productId: p.id, productName: p.name, marketplace: mp, qty,
        total: qty * p.prices[mp], buyer: randomBuyer(),
        status: d === 0 ? (Math.random() < 0.45 ? 'perlu_dikirim' : 'dikirim') : 'dikirim',
        createdAt: ts,
      });
    }
  }
  orders.sort((a, b) => b.createdAt - a.createdAt);

  const syncLogs = [
    { id: uid('log'), productName: 'Keripik Singkong Balado 250g', source: 'shopee', status: 'success', message: 'Keripik Singkong Balado 250g — Shopee laku 2 → stok Tokopedia, TikTok Shop & Lazada auto jadi 118', createdAt: now - 4 * 60000 },
    { id: uid('log'), productName: 'Kaos Polos Hitam Cotton Combed 30s', source: 'tokopedia', status: 'success', message: 'Kaos Polos Hitam Cotton Combed 30s — Tokopedia laku 1 → stok Shopee auto jadi 47', createdAt: now - 11 * 60000 },
    { id: uid('log'), productName: 'Batik Tulis Klaten Motif Parang', source: 'tiktok', status: 'warning', message: 'PERINGATAN: stok Batik Tulis Klaten Motif Parang menipis (sisa 15) — pertimbangkan restock', createdAt: now - 42 * 60000 },
    { id: uid('log'), productName: 'Sambal Pecel Khas Madiun 200g', source: 'shopee', status: 'success', message: 'Sambal Pecel Khas Madiun 200g — Shopee laku 3 → stok Tokopedia, TikTok Shop & Lazada auto jadi 82', createdAt: now - 2 * 3600000 },
    { id: uid('log'), productName: 'Sepatu Sneakers Kanvas Putih', source: 'tokopedia', status: 'failed', message: 'GAGAL: Sepatu Sneakers Kanvas Putih laku 5 di Tokopedia — stok tidak cukup (sisa 27, buffer 2)', createdAt: now - 5 * 3600000 },
  ];

  return {
    products, marketplaces, orders, syncLogs,
    settings: { preventOverselling: true, syncPrice: false, buffer: 2, storeName: 'Toko Berkah Klaten' },
    users: [], user: null,
  };
}

/* ===================== INISIALISASI STORE ===================== */
const persisted = loadPersisted();
const seed = buildSeed();
const store = createStore({
  products: persisted?.products?.length ? persisted.products : seed.products,
  marketplaces: persisted?.marketplaces?.length ? persisted.marketplaces : seed.marketplaces,
  orders: persisted?.orders || seed.orders,
  syncLogs: persisted?.syncLogs || seed.syncLogs,
  settings: Object.assign({}, seed.settings, persisted?.settings || {}),
  users: persisted?.users || [],
  user: persisted?.user || null,
  /* UI state (tidak dipersist): */
  view: 'landing',          // landing | app
  page: 'dashboard',        // dashboard | produk | pesanan | toko | log | pengaturan
  authOpen: false, authTab: 'register',
  toasts: [], sidebarOpen: false, booted: false, now: Date.now(),
});

/* Jam realtime: refresh label "x detik lalu" tiap 10 detik */
setInterval(() => store.setState({ now: Date.now() }), 10000);

/* ===================== TOAST & LOG ===================== */
function toast(msg, type = 'success') {
  const id = uid('tst');
  const cur = store.getState().toasts;
  store.setState({ toasts: [...cur.slice(-2), { id, msg, type }] });
  setTimeout(() => store.setState((s) => ({ toasts: s.toasts.filter((t) => t.id !== id) })), 3400);
}
function addLog(entry) {
  const log = Object.assign({ id: uid('log'), createdAt: Date.now() }, entry);
  store.setState((s) => ({ syncLogs: [log, ...s.syncLogs].slice(0, 120) }));
  return log;
}

/* ================================================================
   FASE 2 — MESIN SINKRONISASI INTI
   handleOrder(productId, marketplaceSource, qty)

   Alur:
   1. Kunci per-produk (orderLocks) → 2 klik bersamaan pada produk yang
      sama tidak bisa balapan; yang kedua menunggu/antre dengan aman.
   2. Simulasi latency API 500ms agar terasa realtime.
   3. Baca state TERBARU di dalam fungsi (bukan dari closure) → data
      selalu fresh walau banyak order masuk berurutan.
   4. Validasi: stok master cukup? (memperhitungkan buffer bila
      "Cegah overselling" aktif). Tidak cukup → tolak + log GAGAL.
   5. Kurangi Stok Master, lalu push nilai baru ke SEMUA marketplace
      yang terhubung dalam SATU setState atomik.
   6. Catat order + log SUKSES, tampilkan toast.
   Karena JS single-threaded dan update dilakukan atomik via setState,
   tidak ada kondisi balapan (race condition) yang bisa merusak stok.
   ================================================================ */
const orderLocks = new Set();

function sellableOf(product, settings) {
  if (!settings.preventOverselling) return product.masterStock;
  return Math.max(0, product.masterStock - settings.buffer);
}

async function handleOrder(productId, source, qty = 1, buyerName) {
  /* 0. Guard anti race-condition */
  if (orderLocks.has(productId)) {
    toast('Produk ini sedang diproses, coba sesaat lagi…', 'warning');
    return { ok: false, reason: 'locked' };
  }
  orderLocks.add(productId);
  try {
    await delay(500); /* simulasi latency API marketplace */

    const s = store.getState(); /* state fresh, bukan closure basi */
    const p = s.products.find((x) => x.id === productId);
    if (!p) { toast('Produk tidak ditemukan.', 'error'); return { ok: false, reason: 'not-found' }; }

    const mpName = mpById(source).name;
    const sellable = sellableOf(p, s.settings);
    qty = Math.max(1, Math.floor(qty || 1));

    /* 1–2. Validasi stok */
    if (p.masterStock < qty || sellable < qty) {
      addLog({
        productName: p.name, source, status: 'failed',
        message: 'GAGAL: ' + p.name + ' laku ' + qty + ' di ' + mpName + ' — stok tidak cukup (sisa ' + p.masterStock + (s.settings.preventOverselling ? ', buffer ' + s.settings.buffer : '') + '). Pesanan ditolak.',
      });
      toast('Stok ' + p.name + ' tidak cukup. Pesanan dari ' + mpName + ' ditolak.', 'error');
      return { ok: false, reason: 'insufficient' };
    }

    /* 3. Kurangi stok master */
    const newMaster = p.masterStock - qty;

    /* 4. Sync ke semua marketplace yang terhubung (atomik, 1x setState) */
    const connectedIds = s.marketplaces.filter((m) => m.connected).map((m) => m.id);
    const newStocks = Object.assign({}, p.stocks);
    const pushedValue = sellableOf(Object.assign({}, p, { masterStock: newMaster }), s.settings);
    connectedIds.forEach((mid) => { newStocks[mid] = pushedValue; });
    /* Jika stok master 0 → semua marketplace ikut 0 (habis). */

    const price = p.prices[source] != null ? p.prices[source] : p.prices.shopee;
    const order = {
      id: uid('ord'),
      code: 'INV/' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '/' + (1000 + Math.floor(Math.random() * 9000)),
      productId, productName: p.name, marketplace: source, qty,
      total: qty * price, buyer: buyerName || randomBuyer(),
      status: 'perlu_dikirim', createdAt: Date.now(),
    };

    /* 5. Log sukses dengan format realtime */
    const others = connectedIds.filter((id) => id !== source).map((id) => mpById(id).name);
    addLog({
      productName: p.name, source, status: 'success',
      message: p.name + ' — ' + mpName + ' laku ' + qty + ' → stok ' + (others.length ? others.join(' & ') + ' auto jadi ' + fmtNum(pushedValue) : 'tersinkron') + ' (master ' + p.masterStock + '→' + newMaster + ')',
    });

    store.setState((st) => ({
      products: st.products.map((x) => x.id === productId ? Object.assign({}, x, { masterStock: newMaster, stocks: newStocks }) : x),
      orders: [order, ...st.orders],
      marketplaces: st.marketplaces.map((m) => m.id === source ? Object.assign({}, m, { lastSync: Date.now() }) : m),
    }));

    /* 6. Toast sukses */
    toast('Pesanan ' + order.code + ' masuk. ' + (connectedIds.length ? 'Stok tersinkron ke ' + connectedIds.length + ' toko.' : 'Belum ada toko terhubung — hubungkan tokomu dulu.'), connectedIds.length ? 'success' : 'warning');
    return { ok: true, order };
  } finally {
    orderLocks.delete(productId); /* selalu buka kunci */
  }
}

/* Buat 1 pesanan dummy acak dari produk yang stoknya masih bisa dijual */
async function createDummyOrder() {
  const s = store.getState();
  const eligible = s.products.filter((p) => sellableOf(p, s.settings) > 0);
  if (!eligible.length) { toast('Semua produk habis / terkunci buffer. Tambah stok dulu.', 'warning'); return; }
  const p = eligible[Math.floor(Math.random() * eligible.length)];
  const connected = s.marketplaces.filter((m) => m.connected);
  const pool = connected.length ? connected : s.marketplaces;
  const mp = pool[Math.floor(Math.random() * pool.length)].id;
  const maxQ = Math.min(3, sellableOf(p, s.settings));
  const qty = 1 + Math.floor(Math.random() * maxQ);
  await handleOrder(p.id, mp, qty);
}

/* ===================== KOMPONEN UI BERSAMA ===================== */
const Icon = ({ name, className }) => <i data-lucide={name} className={className || 'w-5 h-5'}></i>;

/* Segarkan ikon Lucide setiap render (mengganti <i data-lucide> jadi SVG) */
function IconRefresher() {
  useEffect(() => {
    if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} }
  });
  return null;
}

function Modal({ open, onClose, title, subtitle, children, wide }) {
  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [open]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" role="dialog" aria-modal="true">
      <div className="absolute inset-0 bg-slate-900/55 backdrop-blur-[2px]" onClick={onClose}></div>
      <div className={'anim-pop relative w-full bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl max-h-[92vh] overflow-y-auto ' + (wide ? 'sm:max-w-2xl' : 'sm:max-w-md')}>
        <div className="sticky top-0 bg-white/95 backdrop-blur px-5 sm:px-6 pt-5 pb-4 border-b border-slate-100 flex items-start justify-between gap-4 rounded-t-3xl sm:rounded-t-2xl">

            <h3 className="text-lg font-bold text-slate-900">{title}</h3>

function Toasts() {
  const toasts = useStore((s) => s.toasts);
  const styles = {
    success: { bar: 'bg-emerald-500', icon: 'circle-check', iconColor: 'text-emerald-600', bg: 'bg-emerald-50', border: 'border-emerald-200' },
    error:   { bar: 'bg-rose-500',    icon: 'circle-alert', iconColor: 'text-rose-600',    bg: 'bg-rose-50',    border: 'border-rose-200' },
    warning: { bar: 'bg-amber-500',   icon: 'triangle-alert', iconColor: 'text-amber-600', bg: 'bg-amber-50',   border: 'border-amber-200' },
    info:    { bar: 'bg-sky-500',     icon: 'info', iconColor: 'text-sky-600',             bg: 'bg-sky-50',     border: 'border-sky-200' },
  };
  return (
    <div className="fixed z-[60] bottom-20 sm:bottom-6 right-4 left-4 sm:left-auto flex flex-col gap-2 sm:w-96 pointer-events-none">
      {toasts.map((t) => {
        const st = styles[t.type] || styles.info;
        return (
          <div key={t.id} className={'anim-toast pointer-events-auto flex items-start gap-3 rounded-xl border bg-white shadow-lg p-3.5 ' + st.border}>
            <span className={'w-1 self-stretch rounded-full ' + st.bar}></span>
            <Icon name={st.icon} className={'w-5 h-5 mt-0.5 shrink-0 ' + st.iconColor} />
            <p className="text-sm text-slate-700 leading-snug">{t.msg}</p>
          </div>
        );
      })}
    </div>
  );
}

/* ===================== AUTH (Daftar / Masuk) ===================== */
function AuthModal() {
  const open = useStore((s) => s.authOpen);
  const tab = useStore((s) => s.authTab);
  const [name, setName] = useState('');
  const [storeName, setStoreName] = useState('');
  const [email, setEmail] = useState('');
  const [err, setErr] = useState('');
  const close = () => { store.setState({ authOpen: false }); setErr(''); };
  const setTab = (t) => { store.setState({ authTab: t }); setErr(''); };

  const submit = (e) => {
    e.preventDefault();
    setErr('');
    const s = store.getState();
    if (tab === 'register') {
      if (!name.trim() || !email.trim() || !storeName.trim()) { setErr('Lengkapi nama, nama toko, dan email dulu ya.'); return; }
      if (s.users.some((u) => u.email.toLowerCase() === email.trim().toLowerCase())) { setErr('Email ini sudah terdaftar. Silakan masuk.'); return; }
      const user = { name: name.trim(), storeName: storeName.trim(), email: email.trim() };
      store.setState((st) => ({ users: [...st.users, user], user, authOpen: false, view: 'app', page: 'dashboard', settings: Object.assign({}, st.settings, { storeName: user.storeName }) }));
      setName(''); setStoreName(''); setEmail('');
      toast('Akun berhasil dibuat. Selamat datang, ' + user.name + '!', 'success');
    } else {
      const user = s.users.find((u) => u.email.toLowerCase() === email.trim().toLowerCase());
      if (!user) { setErr('Email belum terdaftar. Daftar dulu yuk — gratis.'); return; }
      store.setState({ user, authOpen: false, view: 'app', page: 'dashboard' });
      setEmail('');
      toast('Selamat datang kembali, ' + user.name + '!', 'success');
    }
  };

  return (
    <Modal open={open} onClose={close} title={tab === 'register' ? 'Buat akun gratis' : 'Masuk ke StokSync'} subtitle="Kelola semua tokomu dari satu dashboard.">
      <div className="grid grid-cols-2 gap-1 p-1 bg-slate-100 rounded-xl mb-5">
        {['register', 'login'].map((t) => (
          <button key={t} onClick={() => setTab(t)} className={'py-2 rounded-lg text-sm font-bold transition ' + (tab === t ? 'bg-white shadow text-slate-900' : 'text-slate-500 hover:text-slate-700')}>
            {t === 'register' ? 'Daftar' : 'Masuk'}
          </button>
        ))}
      </div>
      <form onSubmit={submit} className="space-y-4">
        {tab === 'register' && (
          <React.Fragment>
            <Field label="Nama kamu"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="cth: Sari Wulandari" /></Field>
            <Field label="Nama toko / usaha"><input className={inputCls} value={storeName} onChange={(e) => setStoreName(e.target.value)} placeholder="cth: Keripik Balado Mak Iroh" /></Field>
          </React.Fragment>
        )}
        <Field label="Email"><input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="kamu@tokomu.id" /></Field>
        {err && <div className="flex items-start gap-2 text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3.5 py-2.5"><Icon name="circle-alert" className="w-4 h-4 mt-0.5 shrink-0" />{err}</div>}

/* ===================== GRAFIK PENJUALAN (SVG custom) ===================== */
function SalesChart({ data }) {
  const [hover, setHover] = useState(null);
  const max = Math.max.apply(null, data.map((d) => d.value).concat([1]));
  const n = data.length;
  const pts = data.map((d, i) => ({
    x: n === 1 ? 50 : (i / (n - 1)) * 100,
    y: 92 - (d.value / max) * 78,
    label: d.label, value: d.value,
  }));
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(2) + ',' + p.y.toFixed(2)).join(' ');
  const area = line + ' L' + pts[n - 1].x.toFixed(2) + ',100 L' + pts[0].x.toFixed(2) + ',100 Z';
  return (
    <div>
      <div className="relative h-52 sm:h-60 select-none" onMouseLeave={() => setHover(null)}>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 w-full h-full">
          <defs>
            <linearGradient id="salesGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#4f46e5" stopOpacity="0.32" />
              <stop offset="100%" stopColor="#4f46e5" stopOpacity="0.02" />
            </linearGradient>
          </defs>
          {[25, 50, 75].map((g) => <line key={g} x1="0" y1={g} x2="100" y2={g} stroke="#eef1f6" strokeWidth="1" vectorEffect="non-scaling-stroke" />)}
          <path d={area} fill="url(#salesGrad)" />
          <path d={line} fill="none" stroke="#4f46e5" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />
        </svg>
        {pts.map((p, i) => (
          <button key={i} aria-label={p.label + ': ' + fmtIDR(p.value)}
            onMouseEnter={() => setHover(i)} onClick={() => setHover(i)} onFocus={() => setHover(i)}
            className="absolute w-7 h-7 -translate-x-1/2 -translate-y-1/2 rounded-full"
            style={{ left: p.x + '%', top: p.y + '%' }}>
            <span className={'absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-brand-600 bg-white shadow transition-all ' + (hover === i ? 'w-3.5 h-3.5' : 'w-2.5 h-2.5')}></span>
          </button>
        ))}
        {hover != null && (
          <div className="absolute z-10 -translate-x-1/2 pointer-events-none" style={{ left: Math.min(88, Math.max(12, pts[hover].x)) + '%', top: '0' }}>
            <div className="whitespace-nowrap rounded-lg bg-slate-900 text-white text-xs font-semibold px-2.5 py-1.5 shadow-xl">
              {pts[hover].label} • <span className="text-brand-500 font-bold" style={{ color: '#a5b4fc' }}>{fmtIDR(pts[hover].value)}</span>
            </div>
          </div>
        )}
      </div>
      <div className="flex justify-between mt-2 px-0.5">
        {data.map((d, i) => <span key={i} className={'text-[11px] font-semibold ' + (i === n - 1 ? 'text-brand-600' : 'text-slate-400')}>{d.short}</span>)}
      </div>
    </div>
  );
}

function DashboardPage() {
  const products = useStore((s) => s.products);

  const settings = useStore((s) => s.settings);
  const user = useStore((s) => s.user);
  const now = useStore((s) => s.now);
  const [simulating, setSimulating] = useState(false);

  const todayStr = dayKey(now);
  const ordersToday = orders.filter((o) => dayKey(o.createdAt) === todayStr && o.status !== 'dibatalkan');
  const revenueToday = ordersToday.reduce((a, o) => a + o.total, 0);
  const needShip = orders.filter((o) => o.status === 'perlu_dikirim');
  const lowStock = products.filter((p) => p.masterStock <= 5);
  const failedToday = logs.filter((l) => l.status === 'failed' && dayKey(l.createdAt) === todayStr).length;

  const chartData = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(now - i * 86400000);
      days.push(d);
    }
    return days.map((d) => {
      const k = dayKey(d.getTime());
      const rev = orders.filter((o) => dayKey(o.createdAt) === k && o.status !== 'dibatalkan').reduce((a, o) => a + o.total, 0);
      return { label: d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }), short: d.toLocaleDateString('id-ID', { weekday: 'short' }), value: rev };
    });

}

function topProducts(products, orders, n) {
  const map = {};
  orders.forEach((o) => { if (o.status !== 'dibatalkan') map[o.productId] = (map[o.productId] || 0) + o.qty; });
  return products
    .map((p) => Object.assign({}, p, { qty: map[p.id] || 0 }))
    .sort((a, b) => b.qty - a.qty)
    .slice(0, n);
}

/* ---------- Modal tambah / edit produk ---------- */
function ProductModal({ open, editing, onClose }) {
  const settings = useStore((s) => s.settings);
  const [name, setName] = useState('');
  const [sku, setSku] = useState('');
  const [category, setCategory] = useState('Fashion');
  const [stock, setStock] = useState(20);
  const [price, setPrice] = useState(50000);

  useEffect(() => {
    if (open) {
      setName(editing?.name || '');
      setSku(editing?.sku || '');
      setCategory(editing?.category || 'Fashion');
      setStock(editing?.masterStock ?? 20);
      setPrice(editing?.prices?.shopee ?? 50000);
    }
  }, [open]);

  const save = () => {
    if (!name.trim()) { toast('Nama produk wajib diisi.', 'warning'); return; }
    const s = store.getState();
    if (editing) {
      const stockChanged = Number(stock) !== editing.masterStock;
      const newMaster = Math.max(0, Math.floor(Number(stock) || 0));
      const newPrices = { shopee: +price || 0, tokopedia: +price || 0, tiktok: +price || 0, lazada: +price || 0 };
      const newStocks = Object.assign({}, editing.stocks);
      if (stockChanged) {
        /* Stok master berubah → push ulang ke semua toko terhubung */
        const val = sellableOf({ masterStock: newMaster }, s.settings);
        s.marketplaces.filter((m) => m.connected).forEach((m) => { newStocks[m.id] = val; });
        addLog({ productName: name.trim(), source: 'shopee', status: 'info', message: 'INFO: stok master ' + name.trim() + ' diubah manual ' + editing.masterStock + '→' + newMaster + ', semua toko tersinkron' });
      }
      store.setState((st) => ({ products: st.products.map((p) => p.id === editing.id ? Object.assign({}, p, { name: name.trim(), sku: sku.trim() || p.sku, category, masterStock: newMaster, stocks: newStocks, prices: newPrices }) : p) }));
      toast('Produk "' + name.trim() + '" diperbarui.', 'success');
    } else {
      const master = Math.max(0, Math.floor(Number(stock) || 0));
      const pr = Math.max(0, Math.floor(Number(price) || 0));
      const p = {
        id: uid('prd'), name: name.trim(), sku: (sku.trim() || 'SKU-' + Date.now().toString(36).toUpperCase()), category,
        icon: 'package', grad: 'from-brand-500 to-violet-700', masterStock: master,
        stocks: { shopee: master, tokopedia: master, tiktok: master, lazada: master },
        prices: { shopee: pr, tokopedia: pr, tiktok: pr, lazada: pr }, createdAt: Date.now(),
      };
      store.setState((st) => ({ products: [p, ...st.products] }));
      addLog({ productName: p.name, source: 'shopee', status: 'info', message: 'INFO: produk baru ' + p.name + ' ditambahkan (stok master ' + master + ')' });
      toast('Produk "' + p.name + '" ditambahkan ke semua toko.', 'success');
    }
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title={editing ? 'Edit Produk' : 'Tambah Produk Baru'} subtitle="Stok master = stok asli di gudangmu.">
      <div className="space-y-4">
        <Field label="Nama produk"><input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="cth: Kaos Polos Hitam Cotton Combed" /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="SKU"><input className={inputCls} value={sku} onChange={(e) => setSku(e.target.value)} placeholder="cth: KOS-HTM-001" /></Field>
          <Field label="Kategori">
            <select className={inputCls} value={category} onChange={(e) => setCategory(e.target.value)}>
              {['Fashion', 'Makanan', 'Minuman', 'Kesehatan', 'Kerajinan', 'Home & Living', 'Elektronik', 'Lainnya'].map((c) => <option key={c}>{c}</option>)}
            </select>
          </Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Stok master (gudang)" hint={settings.preventOverselling ? 'Buffer ' + settings.buffer + ' pcs disisihkan otomatis.' : ''}>
            <input type="number" min="0" className={inputCls} value={stock} onChange={(e) => setStock(e.target.value)} />
          </Field>
          <Field label="Harga dasar (Rp)" hint="Disamakan ke semua marketplace.">
            <input type="number" min="0" step="500" className={inputCls} value={price} onChange={(e) => setPrice(e.target.value)} />
          </Field>
        </div>
        <button onClick={save} className="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md">
          {editing ? 'Simpan Perubahan' : 'Tambah ke Semua Toko'}
        </button>
      </div>
    </Modal>
  );
}

/* ---------- Modal simulasi pesanan per produk ---------- */
function QuickSellModal({ product, onClose }) {
  const mps = useStore((s) => s.marketplaces);
  const [mp, setMp] = useState('shopee');
  const [qty, setQty] = useState(1);
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    if (product) {
      const connected = mps.filter((m) => m.connected);
      setMp((connected[0] || mps[0]).id);
      setQty(1); setBusy(false);
    }
  }, [product]);
  if (!product) return null;

  const submit = async () => {
    setBusy(true);
    const r = await handleOrder(product.id, mp, qty);
    setBusy(false);
    if (r.ok) onClose();
  };

  return (
    <Modal open={!!product} onClose={onClose} title="Simulasi Pesanan Masuk" subtitle={product.name}>
      <div className="space-y-4">
        <Field label="Marketplace sumber">
          <select className={inputCls} value={mp} onChange={(e) => setMp(e.target.value)}>
            {mps.map((m) => <option key={m.id} value={m.id}>{mpById(m.id).name}{m.connected ? '' : ' (belum terhubung)'}</option>)}
          </select>
        </Field>
        <Field label="Jumlah (qty)">
          <div className="flex items-center gap-3">
            <button onClick={() => setQty(Math.max(1, qty - 1))} className="w-10 h-10 rounded-xl border border-slate-200 font-bold text-lg hover:bg-slate-50">−</button>
            <span className="text-xl font-extrabold w-10 text-center">{qty}</span>
            <button onClick={() => setQty(qty + 1)} className="w-10 h-10 rounded-xl border border-slate-200 font-bold text-lg hover:bg-slate-50">+</button>
            <span className="text-xs text-slate-400 ml-1">Stok master: {product.masterStock}</span>
          </div>
        </Field>
        <div className="rounded-xl bg-slate-50 border border-slate-100 p-3.5 text-xs text-slate-500 leading-relaxed">
          Saat diklik, StokSync akan: cek stok → kurangi <b>stok master</b> → push ke <b>semua toko terhubung</b> → catat log. persis seperti order asli.
        </div>
        <button onClick={submit} disabled={busy} className="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold shadow-md disabled:opacity-60 flex items-center justify-center gap-2">
          <Icon name={busy ? 'refresh-cw' : 'zap'} className={'w-4 h-4 ' + (busy ? 'spin' : '')} />
          {busy ? 'Menyinkronkan…' : 'Buat Pesanan & Sync Stok'}
        </button>
      </div>
    </Modal>
  );
}

/* ---------- Modal edit harga massal ---------- */
function BulkPriceModal({ open, onClose }) {
  const settings = useStore((s) => s.settings);
  const [target, setTarget] = useState('tiktok');
  const [percent, setPercent] = useState(10);

  const apply = (pct, tgt) => {
    const p = Number(pct);
    if (!p || p <= -100) { toast('Persentase tidak valid.', 'warning'); return; }
    /* 'all' = preset semua marketplace; syncPrice aktif = selalu semua */
    const targets = (tgt === 'all' || settings.syncPrice) ? MP.map((m) => m.id) : [tgt || target];
    store.setState((st) => ({
      products: st.products.map((prod) => {
        const prices = Object.assign({}, prod.prices);
        targets.forEach((tid) => { prices[tid] = Math.max(0, Math.round((prices[tid] || 0) * (1 + p / 100))); });
        return Object.assign({}, prod, { prices });
      }),
    }));
    const names = targets.map((t) => mpById(t).name).join(', ');
    addLog({ productName: 'Semua produk', source: target, status: 'info', message: 'INFO: harga massal ' + (p > 0 ? '+' : '') + p + '% diterapkan untuk ' + names + ' (' + store.getState().products.length + ' SKU)' });
    toast('Harga ' + (p > 0 ? 'naik' : 'turun') + ' ' + Math.abs(p) + '% untuk ' + names + '.', 'success');
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title="Edit Harga Massal" subtitle="Ubah harga banyak SKU sekaligus per marketplace.">
      <div className="space-y-4">
        <div className="flex flex-wrap gap-2">
          {[['+10% TikTok', 10, 'tiktok'], ['+5% Semua MP', 5, 'all'], ['-10% Shopee', -10, 'shopee']].map((c, i) => (
            <button key={i} onClick={() => apply(c[1], c[2])}
              className="px-3 py-2 rounded-xl bg-brand-50 border border-brand-100 text-xs font-bold text-brand-700 hover:bg-brand-100">{c[0]}</button>
          ))}
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Marketplace target">
            <select className={inputCls} value={target} onChange={(e) => setTarget(e.target.value)}>
              {MP.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          </Field>
          <Field label="Persentase (%)" hint="Negatif untuk diskon.">
            <input type="number" className={inputCls} value={percent} onChange={(e) => setPercent(e.target.value)} placeholder="cth: 10" />
          </Field>
        </div>
        {settings.syncPrice && <p className="text-xs text-sky-600 bg-sky-50 border border-sky-200 rounded-xl px-3 py-2">“Sync harga juga” aktif — perubahan akan diterapkan ke SEMUA marketplace.</p>}

      </div>
    </Modal>
  );
}

/* ---------- Modal import CSV ---------- */
function ImportModal({ open, onClose }) {
  const fileRef = useRef(null);
  const [preview, setPreview] = useState([]);
  const [fileName, setFileName] = useState('');

  const downloadTemplate = () => {
    downloadCSV('template-import-stoksync.csv', [
      { nama: 'Kaos Polos Putih', sku: 'KOS-PTH-011', kategori: 'Fashion', stok: 50, harga: 45000 },
      { nama: 'Kopi Tubruk 250g', sku: 'KOP-TBR-012', kategori: 'Minuman', stok: 30, harga: 28000 },
    ]);
  };

  const onFile = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    setFileName(f.name);
    const reader = new FileReader();
    reader.onload = () => {
      const rows = parseCSV(String(reader.result || ''));
      setPreview(rows.slice(0, 5));
      e.target._rows = rows;
    };
    reader.readAsText(f);
  };

  const doImport = () => {
    const rows = (fileRef.current && fileRef.current._rows) || [];
    if (!rows.length) { toast('Pilih file CSV dulu.', 'warning'); return; }
    let added = 0;
    const news = [];
    rows.forEach((r) => {
      const nama = r.nama || r.name || r.produk;
      if (!nama) return;
      const master = Math.max(0, parseInt(r.stok || r.stock || r.stok_master || '0', 10) || 0);
      const pr = Math.max(0, parseInt(r.harga || r.price || '0', 10) || 0);
      news.push({
        id: uid('prd'), name: String(nama).trim(), sku: String(r.sku || 'SKU-' + Date.now().toString(36).toUpperCase() + added).trim(),
        category: String(r.kategori || r.category || 'Lainnya').trim(), icon: 'package', grad: 'from-brand-500 to-violet-700',
        masterStock: master,
        stocks: { shopee: master, tokopedia: master, tiktok: master, lazada: master },
        prices: { shopee: pr, tokopedia: pr, tiktok: pr, lazada: pr }, createdAt: Date.now(),
      });
      added++;
    });
    if (!added) { toast('Tidak ada baris valid. Cek format CSV-mu.', 'error'); return; }
    store.setState((s) => ({ products: [...news, ...s.products] }));
    addLog({ productName: added + ' produk', source: 'shopee', status: 'info', message: 'INFO: import CSV ' + fileName + ' — ' + added + ' produk ditambahkan' });
    toast(added + ' produk berhasil diimport.', 'success');
    setPreview([]); setFileName('');
    onClose();
  };

  return (
    <Modal open={open} onClose={onClose} title="Import Produk dari CSV" subtitle="Kolom: nama, sku, kategori, stok, harga.">
      <div className="space-y-4">
        <button onClick={downloadTemplate} className="flex items-center gap-2 text-sm font-bold text-brand-600 hover:underline"><Icon name="download" className="w-4 h-4" />Unduh template CSV</button>
        <input ref={fileRef} type="file" accept=".csv" onChange={onFile} className="hidden" id="csvFile" />
        <label htmlFor="csvFile" className="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-slate-200 rounded-2xl py-8 cursor-pointer hover:border-brand-400 hover:bg-brand-50/40 transition">
          <Icon name="upload" className="w-8 h-8 text-slate-300" />
          <span className="text-sm font-bold text-slate-600">{fileName || 'Klik untuk pilih file .csv'}</span>
          <span className="text-xs text-slate-400">maksimal 500 baris per import</span>
        </label>
        {preview.length > 0 && (
          <div className="rounded-xl border border-slate-100 overflow-hidden">
            <div className="px-3 py-2 bg-slate-50 text-xs font-bold text-slate-500">Preview ({preview.length} baris pertama)</div>
            {preview.map((r, i) => <div key={i} className="px-3 py-2 text-xs border-t border-slate-50 truncate">{r.nama || r.name || '(tanpa nama)'} • stok {r.stok || r.stock || 0} • {fmtIDR(parseInt(r.harga || r.price || '0', 10) || 0)}</div>)}
          </div>
        )}
        <button onClick={doImport} className="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md">Import Sekarang</button>
      </div>
    </Modal>
  );
}

const DOC_LINKS = [
  ['Shopee Open Platform', 'https://open.shopee.com/'],
  ['Tokopedia Developer', 'https://developer.tokopedia.com/'],
  ['TikTok Shop Partner Center', 'https://partner.tiktokshop.com/'],

function StoresPage() {
  const mps = useStore((s) => s.marketplaces);
  const now = useStore((s) => s.now);
  const [connecting, setConnecting] = useState(null);
  const [apiKey, setApiKey] = useState('');
  const [busy, setBusy] = useState(false);

  const openConnect = (id) => { setConnecting(id); setApiKey(''); setBusy(false); };
  const genKey = () => setApiKey('sk_live_' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6));

  const doConnect = async () => {
    if (!apiKey.trim()) { toast('Masukkan API key dulu (atau generate dummy).', 'warning'); return; }
    setBusy(true);
    await delay(900); /* simulasi handshake API */
    const masked = apiKey.slice(0, 7) + '•••• •••• ' + apiKey.slice(-4);
    store.setState((s) => ({ marketplaces: s.marketplaces.map((m) => m.id === connecting ? Object.assign({}, m, { connected: true, apiKey: masked, lastSync: Date.now() }) : m) }));
    addLog({ productName: mpById(connecting).name, source: connecting, status: 'info', message: 'INFO: toko ' + mpById(connecting).name + ' terhubung (simulasi API). Stok awal diselaraskan.' });
    toast(mpById(connecting).name + ' berhasil terhubung!', 'success');
    setBusy(false); setConnecting(null);
  };

  const disconnect = (id) => {
    if (!window.confirm('Putuskan ' + mpById(id).name + '? Stoknya tidak akan ikut tersinkron lagi.')) return;
    store.setState((s) => ({ marketplaces: s.marketplaces.map((m) => m.id === id ? Object.assign({}, m, { connected: false, apiKey: '', lastSync: null }) : m) }));
    addLog({ productName: mpById(id).name, source: id, status: 'warning', message: 'PERINGATAN: toko ' + mpById(id).name + ' diputus. Sinkronisasi ke toko ini dihentikan.' });
    toast(mpById(id).name + ' diputus.', 'info');
  };

  const conn = mps.filter((m) => m.connected).length;

  return (
    <div className="space-y-4">
      <div className="flex items-start gap-3 p-4 rounded-2xl bg-sky-50 border border-sky-200">
        <Icon name="info" className="w-5 h-5 text-sky-600 shrink-0 mt-0.5" />
        <div className="text-sm text-sky-800 leading-relaxed">
          <b>Mode simulasi aktif.</b> Koneksi di halaman ini memakai API key dummy agar alur sync bisa dicoba end-to-end.
          Untuk production, ganti dengan <b>OAuth resmi</b> tiap marketplace — link dokumentasi resmi ada di bawah.
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-4">
        {mps.map((m) => {
          const meta = mpById(m.id);
          return (
            <div key={m.id} className="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
              <div className="flex items-start justify-between gap-3">
                <div className="flex items-center gap-3">
                  <span className="w-12 h-12 rounded-2xl flex items-center justify-center text-white font-extrabold text-lg shadow" style={{ background: meta.color }}>{meta.letter}</span>
                  <div>
                    <div className="font-bold">{meta.name}</div>
                    <div className="text-[11px] text-slate-400 font-mono">{m.connected ? m.apiKey : 'belum terhubung'}</div>
                  </div>
                </div>
                <span className={'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold ' + (m.connected ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500')}>
                  <span className={'w-1.5 h-1.5 rounded-full ' + (m.connected ? 'bg-emerald-500 pulse-dot' : 'bg-slate-400')}></span>
                  {m.connected ? 'Terhubung' : 'Terputus'}
                </span>
              </div>
              <div className="mt-4 flex items-center justify-between">
                <span className="text-xs text-slate-400">{m.lastSync ? 'Sync terakhir ' + timeAgo(m.lastSync, now) : 'Belum pernah sync'}</span>
                {m.connected
                  ? <button onClick={() => disconnect(m.id)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100"><Icon name="unlink" className="w-3.5 h-3.5" />Putuskan</button>
                  : <button onClick={() => openConnect(m.id)} className="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold text-white bg-slate-900 hover:bg-slate-700"><Icon name="plug-zap" className="w-3.5 h-3.5" />Hubungkan</button>}
              </div>
            </div>
          );
        })}
      </div>

      <div className="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
        <h3 className="font-bold flex items-center gap-2"><Icon name="key-round" className="w-4 h-4 text-brand-600" />Dokumentasi API Resmi</h3>
        <p className="text-xs text-slate-400 mt-1 mb-3">Untuk integrasi production (OAuth + webhook order realtime).</p>
        <div className="grid sm:grid-cols-2 gap-2">
          {DOC_LINKS.map((d, i) => (
            <a key={i} href={d[1]} target="_blank" rel="noopener noreferrer" className="flex items-center justify-between px-4 py-3 rounded-xl border border-slate-100 hover:border-brand-300 hover:bg-brand-50/40 text-sm font-semibold text-slate-700">
              {d[0]}<Icon name="external-link" className="w-4 h-4 text-slate-300" />
            </a>
          ))}
        </div>
      </div>

      {/* Modal simulasi koneksi API */}
      <Modal open={!!connecting} onClose={() => setConnecting(null)} title="Simulasi Koneksi API" subtitle={connecting ? 'Menghubungkan ' + mpById(connecting).name + '…' : ''}>
        <div className="space-y-4">
          <div className="rounded-xl bg-amber-50 border border-amber-200 p-3.5 text-xs text-amber-800 leading-relaxed">
            Ini <b>simulasi</b> untuk keperluan demo. Di production, tombol ini membuka halaman <b>OAuth resmi marketplace</b> (login sebagai seller → authorize → token tersimpan aman di server).
          </div>
          <Field label="API Key (dummy)" hint="Klik Generate untuk membuat key dummy.">
            <div className="flex gap-2">
              <input className={inputCls + ' font-mono'} value={apiKey} onChange={(e) => setApiKey(e.target.value)} placeholder="sk_live_••••••••" />
              <button onClick={genKey} className="shrink-0 px-3.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-600 hover:border-brand-400 hover:text-brand-700">Generate</button>
            </div>
          </Field>
          <button onClick={doConnect} disabled={busy} className="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-700 text-white font-bold disabled:opacity-60 flex items-center justify-center gap-2">
            <Icon name={busy ? 'refresh-cw' : 'plug-zap'} className={'w-4 h-4 ' + (busy ? 'spin' : '')} />
            {busy ? 'Menghubungkan…' : 'Hubungkan Toko'}
          </button>
        </div>
      </Modal>
    </div>
  );
}

function SettingsPage() {

  const orders = useStore((s) => s.orders);
  const logs = useStore((s) => s.syncLogs);
  const [storeName, setStoreName] = useState(settings.storeName);
  const [ownerName, setOwnerName] = useState(user?.name || '');

  const set = (patch, msg) => {
    store.setState((s) => ({ settings: Object.assign({}, s.settings, patch) }));
    if (msg) toast(msg, 'success');
  };

  const saveProfile = () => {
    if (!storeName.trim()) { toast('Nama toko wajib diisi.', 'warning'); return; }
    store.setState((s) => ({
      settings: Object.assign({}, s.settings, { storeName: storeName.trim() }),
      user: s.user ? Object.assign({}, s.user, { name: ownerName.trim() || s.user.name, storeName: storeName.trim() }) : s.user,
    }));
    toast('Profil toko disimpan.', 'success');

  const backup = () => {
    const s = store.getState();

    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);

  const resetAll = () => {
    if (!window.confirm('Reset SEMUA data ke awal (produk, pesanan, log)? Tindakan ini tidak bisa dibatalkan.')) return;

  const rules = [
    { key: 'preventOverselling', icon: 'shield-check', title: 'Cegah overselling', desc: 'Jika stok tersisa sedikit, jangan jual ke toko lain. Order yang melebihi stok otomatis ditolak + tercatat di log.' },
    { key: 'syncPrice', icon: 'banknote', title: 'Sync harga juga', desc: 'Saat edit harga massal, terapkan ke semua marketplace sekaligus (bukan per toko).' },
  ];

  return (
    <div className="space-y-4 max-w-3xl">

        <h3 className="font-bold mb-4 flex items-center gap-2"><Icon name="store" className="w-4 h-4 text-brand-600" />Profil Toko</h3>

        </div>
        <button onClick={saveProfile} className="mt-4 px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold">Simpan Profil</button>
      </div>

      {/* Aturan sync */}
      <div className="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
        <h3 className="font-bold mb-1 flex items-center gap-2"><Icon name="sliders-horizontal" className="w-4 h-4 text-brand-600" />Aturan Sinkronisasi</h3>
        <p className="text-xs text-slate-400 mb-4">Berlaku untuk setiap pesanan yang masuk via <b>handleOrder()</b>.</p>
        <div className="divide-y divide-slate-50">
          {rules.map((r) => (
            <div key={r.key} className="flex items-center gap-3 py-4">
              <span className="w-10 h-10 rounded-xl bg-brand-50 flex items-center justify-center shrink-0"><Icon name={r.icon} className="w-5 h-5 text-brand-600" /></span>
              <div className="flex-1 min-w-0"><div className="font-bold text-sm">{r.title}</div><div className="text-xs text-slate-500 leading-relaxed">{r.desc}</div></div>
              <Switch checked={!!settings[r.key]} onChange={(v) => set({ [r.key]: v }, r.title + (v ? ' diaktifkan.' : ' dimatikan.'))} />
            </div>
          ))}
          <div className="flex items-center gap-3 py-4">
            <span className="w-10 h-10 rounded-xl bg-brand-50 flex items-center justify-center shrink-0"><Icon name="package" className="w-5 h-5 text-brand-600" /></span>
            <div className="flex-1 min-w-0">
              <div className="font-bold text-sm">Buffer stok gudang</div>
              <div className="text-xs text-slate-500 leading-relaxed">Sisakan stok di gudang yang tidak dijual ke marketplace. Berlaku saat “Cegah overselling” aktif.</div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => set({ buffer: Math.max(0, settings.buffer - 1) })} className="w-8 h-8 rounded-lg border border-slate-200 font-bold hover:bg-slate-50">−</button>
              <span className="w-10 text-center font-extrabold">{settings.buffer}<span className="text-xs font-medium text-slate-400"> pcs</span></span>
              <button onClick={() => set({ buffer: Math.min(50, settings.buffer + 1) })} className="w-8 h-8 rounded-lg border border-slate-200 font-bold hover:bg-slate-50">+</button>
            </div>
          </div>
        </div>
      </div>

      {/* Data */}
      <div className="bg-white rounded-2xl border border-slate-100 p-5 shadow-sm">
        <h3 className="font-bold mb-4 flex items-center gap-2"><Icon name="file-text" className="w-4 h-4 text-brand-600" />Data & Penyimpanan</h3>
        <div className="grid grid-cols-3 gap-2 text-center mb-4">
          {[['Produk', products.length, 'package'], ['Pesanan', orders.length, 'shopping-cart'], ['Log', logs.length, 'history']].map((d, i) => (
            <div key={i} className="rounded-xl bg-slate-50 border border-slate-100 py-3">
              <Icon name={d[2]} className="w-4 h-4 mx-auto text-slate-400 mb-1" />
              <div className="font-extrabold">{d[1]}</div><div className="text-[11px] text-slate-400">{d[0]}</div>
            </div>
          ))}
        </div>
        <p className="text-xs text-slate-400 leading-relaxed mb-4">Data tersimpan lokal di browser ini (<span className="font-mono font-bold">localStorage: stoksync_v1</span>). Struktur skema sudah siap migrasi ke Supabase: <span className="font-mono">products, marketplaces, orders, sync_logs</span> — lihat PANDUAN.md.</p>
        <div className="flex flex-wrap gap-2">
          <button onClick={backup} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold text-slate-600 hover:border-brand-400 hover:text-brand-700"><Icon name="download" className="w-4 h-4" />Unduh Backup (JSON)</button>
          <button onClick={resetAll} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl border border-rose-200 text-sm font-bold text-rose-600 hover:bg-rose-50"><Icon name="trash-2" className="w-4 h-4" />Reset Data Demo</button>
        </div>
      </div>

      <p className="text-center text-xs text-slate-300 pb-4">StokSync v1.0.0 • Satu Stok Untuk Semua Toko • Klaten, Indonesia</p>
    </div>
  );
}

/* ===================== ROOT ===================== */
function App() {
  const view = useStore((s) => s.view);
  const booted = useStore((s) => s.booted);
  useEffect(() => {
    const t = setTimeout(() => store.setState({ booted: true }), 900);
    return () => clearTimeout(t);
  }, []);
  return (
    <React.Fragment>
      <IconRefresher />
      <Toasts />
      {!booted ? <Splash /> : (view === 'app' ? <Shell /> : <Landing />)}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
